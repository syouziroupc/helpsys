name: Deep audit regressions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deep-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check deep-audit scripts
        run: |
          node --check worker/quality-guide.js
          node --check worker/deep-audit-selftest.mjs
          node --check tests/deep-audit-contract.mjs
          node --check tests/privacy-contract.mjs

      - name: Run deep-audit regressions
        run: |
          node worker/deep-audit-selftest.mjs
          node tests/deep-audit-contract.mjs
          node tests/privacy-contract.mjs

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Build normal edition
        run: dotnet build HelpSys.sln -c Release --no-restore

      - name: Run Privacy Gate normal probe
        run: dotnet run --project tests/HelpSys.PrivacyProbe/HelpSys.PrivacyProbe.csproj -c Release

      - name: Build Safe edition
        run: dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release -p:SafeBuild=true

      - name: Run Privacy Gate Safe probe
        run: dotnet run --project tests/HelpSys.PrivacyProbe/HelpSys.PrivacyProbe.csproj -c Release -p:SafeBuild=true -- --expect-safe-profile
