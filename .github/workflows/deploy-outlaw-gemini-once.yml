name: Deploy Outlaw Gemini once

on:
  push:
    branches: [experimental/outlaw-operation-first-20260923]
    paths:
      - ".github/workflows/deploy-outlaw-gemini-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      URL: https://helpsys.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact Outlaw branch state and credentials
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --check worker/quality-guide.js
          node --check worker/reliability-v4-guard.js
          grep -q 'responseJsonSchema: qualityTool.parameters' worker/quality-guide.js
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GEMINI_API_KEY:-}"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Put Gemini secret
        shell: bash
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.jsonc

      - name: Deploy current Outlaw Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          body=''
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/health/outlaw" || true)"
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.ok===true&&d.geminiConfigured===true&&Array.isArray(d.providers)&&d.providers.includes('gemini')&&d.providers.includes('glm')))" )"
            [ "$ok" = true ] && break
            [ "$i" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Smoke Gemini and GLM
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.URL;
          const body={request:'設定を開く次の操作を案内して',history:[],systemContext:{foregroundProcess:'explorer',foregroundTitle:'デスクトップ',foregroundProcessId:1234,taskbarVisible:true,runningApps:['explorer'],browser:null},evidence:{screenshotPresent:false},elements:[{id:'u1',name:'スタート',automationId:'Start',className:'',controlType:'Button',processName:'explorer',interactable:true,enabled:true,keyboardFocusable:true,focused:false,password:false,processId:1234,value:null,toggleState:null,selected:null,expandCollapseState:null,x:0,y:0,width:80,height:40}]};
          for (const aiProvider of ['gemini','glm']) {
            const r=await fetch(base+'/v1/outlaw-plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,aiProvider})});
            const text=await r.text();
            if(!r.ok) throw new Error(aiProvider+' HTTP '+r.status+': '+text.slice(0,500));
            const d=JSON.parse(text);
            if(!['target','clarify','done','not_found'].includes(d?.status)) throw new Error(aiProvider+' invalid response: '+text.slice(0,500));
            console.log(aiProvider+'_smoke',JSON.stringify(d));
          }
          NODE
