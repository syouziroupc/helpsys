name: Deploy HelpSys Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/stable-router.js"
      - "worker/stable-gemini.js"
      - "worker/education-gemini.js"
      - "worker/outlaw-guide.js"
      - "wrangler.jsonc"
      - "site/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: helpsys-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Worker sources
        run: |
          node --check worker/stable-gemini.js
          node --check worker/education-gemini.js
          node --check worker/outlaw-guide.js
          node --check worker/stable-router.js
          node tests/outlaw-worker-grounding-contract.mjs

      - name: Detect explicit Cloudflare deployment credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Explicit Wrangler deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Explicit Wrangler credentials are not configured; Cloudflare Git integration will deploy main."
          fi

      - name: Install Wrangler
        if: steps.cf.outputs.available == 'true'
        run: npm install --no-package-lock --ignore-scripts

      - name: Deploy production Worker
        if: steps.cf.outputs.available == 'true'
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify Outlaw production route
        shell: bash
        run: |
          node <<'NODE'
          const base='https://helpsys.syouziroupc.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let health=null;
          for(let i=0;i<10;i++){
            try{
              const r=await fetch(base+'/health/outlaw',{cache:'no-store'});
              if(r.ok){
                const j=await r.json();
                if(j?.ok===true &&
                   j?.service==='helpsys-outlaw' &&
                   j?.version==='outlaw-2026.09.24-r3.7' &&
                   j?.independentVisionReview===true &&
                   j?.visualCoordinateSpace==='image_px' &&
                   j?.geometryConsensus===true &&
                   j?.visualConsensusField===true &&
                   j?.aiConfigured===true &&
                   Array.isArray(j?.providers) &&
                   ['auto','gemini','glm'].every(x=>j.providers.includes(x))){
                  health=j; break;
                }
              }
            }catch{}
            await sleep(3000);
          }
          if(!health) throw new Error('Outlaw production health endpoint did not converge.');

          const body={
            request:'設定を開く次の操作を案内して',
            history:[],
            systemContext:{
              foregroundProcess:'explorer',
              foregroundTitle:'デスクトップ',
              foregroundProcessId:1234,
              taskbarVisible:true,
              runningApps:['explorer'],
              browser:null
            },
            evidence:{screenshotPresent:false},
            elements:[
              {
                id:'u1',name:'スタート',automationId:'Start',className:'',
                controlType:'Button',processName:'explorer',interactable:true,
                enabled:true,keyboardFocusable:true,focused:false,password:false,
                processId:1234,value:null,toggleState:null,selected:null,
                expandCollapseState:null,x:0,y:0,width:80,height:40
              }
            ]
          };
          body.aiProvider='glm';
          const r=await fetch(base+'/v1/outlaw-plan',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify(body)
          });
          const text=await r.text();
          if(!r.ok) throw new Error('Outlaw planner HTTP '+r.status+': '+text.slice(0,400));
          let parsed;
          try{parsed=JSON.parse(text)}catch{throw new Error('Outlaw planner returned non-JSON');}
          if(!['target','clarify','done','not_found'].includes(parsed?.status))
            throw new Error('Outlaw planner returned invalid status: '+text.slice(0,400));

          let geminiSmoke=null;
          if(health?.geminiConfigured===true){
            body.aiProvider='gemini';
            const gr=await fetch(base+'/v1/outlaw-plan',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify(body)
            });
            const gt=await gr.text();
            if(!gr.ok) throw new Error('Outlaw Gemini planner HTTP '+gr.status+': '+gt.slice(0,400));
            try{geminiSmoke=JSON.parse(gt)}catch{throw new Error('Outlaw Gemini planner returned non-JSON');}
            if(!['target','clarify','done','not_found'].includes(geminiSmoke?.status))
              throw new Error('Outlaw Gemini planner returned invalid status: '+gt.slice(0,400));
          }

          console.log('outlaw_health',JSON.stringify(health));
          console.log('outlaw_glm_smoke',JSON.stringify(parsed));
          console.log('outlaw_gemini_smoke',JSON.stringify(geminiSmoke));

          let siteHealth=null;
          for(let i=0;i<20;i++){
            try{
              const sr=await fetch(base+'/health/site',{cache:'no-store'});
              if(sr.ok){
                const sj=await sr.json();
                if(sj?.ok===true &&
                   sj?.service==='helpsys-site' &&
                   sj?.revision==='a3.0001-outlaw-3.2.1-85956ddd'){
                  siteHealth=sj; break;
                }
              }
            }catch{}
            await sleep(3000);
          }
          if(!siteHealth) throw new Error('HelpSys site deployment did not reach 3.2.1 revision.');
          console.log('site_health',JSON.stringify(siteHealth));

          const tr=await fetch(base+'/v1/transcribe',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:'{}'
          });
          if(tr.status!==415){
            const tt=await tr.text();
            throw new Error('Transcribe route is not wired correctly. Expected 415, got '+tr.status+': '+tt.slice(0,300));
          }
          console.log('transcribe_route_smoke','HTTP 415 as expected for non-audio payload');
          NODE
