name: Publish HelpSys Education preview

on:
  push:
    branches: [main]
    paths:
      - "src/HelpSys.Education/**"
      - "EDUCATION.md"
      - ".github/workflows/education-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/HelpSys.Education/HelpSys.Education.csproj

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'publish\education-win-x64'
          $assetName = 'HelpSys-Education-v2.2-preview-win-x64.zip'
          $stableAssetName = 'HelpSys-Education-latest-win-x64.zip'
          dotnet publish src/HelpSys.Education/HelpSys.Education.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o $out
          Copy-Item EDUCATION.md (Join-Path $out 'EDUCATION.md')
          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $PWD $assetName) -Force
          Copy-Item (Join-Path $PWD $assetName) (Join-Path $PWD $stableAssetName) -Force

      - name: Update Education preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'education-preview-latest'
          $assetName = 'HelpSys-Education-v2.2-preview-win-x64.zip'
          $stableAssetName = 'HelpSys-Education-latest-win-x64.zip'
          $asset = Join-Path $PWD $assetName
          $stableAsset = Join-Path $PWD $stableAssetName
          $allowedAssets = @($assetName, $stableAssetName)
          $notes = @"
          HelpSys Education Preview — Foundations v2.2

          - Windows 10 / 11 (64-bit)
          - 通常版HelpSysとは別アプリ
          - Versioned package: $assetName
          - Stable site download alias: $stableAssetName
          - ダウンロード直後から本番HelpSys WorkerのEducation APIへ接続
          - 一時通信失敗を1回だけ再試行
          - 進捗保存を原子的書き換え + バックアップ復旧へ変更
          - PC未経験から始める段階制基礎課程
          - 難易度1/5「はじめて」→ 5/5「総合マスター」
          - 前単元の教育 → 実習 → 100%正解テスト合格で次単元を解放
          - 合格済み単元はいつでも復習可能
          - 未解放単元は選択不可
          - テスト中は教育AIを呼び出さない
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldAssets = @(gh release view $tag --json assets --jq '.assets[].name' --repo $env:GITHUB_REPOSITORY)
            foreach ($old in $oldAssets) {
              if ($old -like 'HelpSys*.zip' -and $allowedAssets -notcontains $old) {
                gh release delete-asset $tag $old --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale Education release asset: $old" }
              }
            }
            gh release upload $tag $asset $stableAsset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload Education preview assets.' }
            gh release edit $tag --title "HelpSys Education Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $asset $stableAsset --target main --title "HelpSys Education Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }

          $published = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($expected in $allowedAssets) {
            if ($published -notcontains $expected) { throw "Education release asset missing after publish: $expected" }
          }
