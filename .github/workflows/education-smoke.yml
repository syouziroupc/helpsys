name: HelpSys Education smoke

on:
  push:
    branches: [main]
    paths:
      - "src/HelpSys.Education/**"
      - "worker/education.js"
      - "worker/education-selftest.mjs"
      - "wrangler.education.jsonc"
      - ".github/workflows/education-smoke.yml"
  pull_request:
    paths:
      - "src/HelpSys.Education/**"
      - "HelpSys.sln"
      - "worker/education.js"
      - "worker/education-selftest.mjs"
      - "wrangler.education.jsonc"
      - ".github/workflows/education-smoke.yml"

jobs:
  build-and-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Education AI contract
        run: |
          node --check worker/education.js
          node --check worker/education-selftest.mjs
          node worker/education-selftest.mjs

      - name: Restore and build
        run: |
          dotnet restore src/HelpSys.Education/HelpSys.Education.csproj
          dotnet build src/HelpSys.Education/HelpSys.Education.csproj -c Release --no-restore

      - name: Validate curriculum contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'src/HelpSys.Education/bin/Release/net10.0-windows/HelpSys.Education.exe'
          $selfTest = Start-Process $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($selfTest.ExitCode -ne 0) { throw "Education curriculum self-test failed with exit code $($selfTest.ExitCode)." }

      - name: Launch Education UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Resolve-Path 'src/HelpSys.Education/bin/Release/net10.0-windows/HelpSys.Education.exe'
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 4

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          function Save-Screenshot([string] $path) {
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try { $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size); $bitmap.Save((Join-Path $PWD $path), [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $graphics.Dispose(); $bitmap.Dispose() }
          }

          function Get-Names($window) {
            $nodes = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $names = @($window.Current.Name)
            foreach ($node in $nodes) { try { if (-not [string]::IsNullOrWhiteSpace($node.Current.Name)) { $names += $node.Current.Name } } catch { } }
            return $names
          }

          function Invoke-ByName($window, [string] $name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $node = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if ($null -eq $node) { throw "Education UI missing invokable element: $name" }
            $pattern = $node.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $pattern.Invoke()
            Start-Sleep -Milliseconds 500
          }

          try {
            if ($process.HasExited) { throw 'HelpSys Education exited during startup.' }
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
            $window = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            if ($null -eq $window) { throw 'HelpSys Education top-level window was not exposed to UI Automation.' }

            $names = Get-Names $window
            foreach ($required in @('HelpSys Education','教育','練習','テスト','全体進捗','用語集','0-1. パソコンは何をする道具か')) {
              if (-not ($names -contains $required)) { Save-Screenshot 'artifacts/education-failure.png'; throw "Education UI missing required element: $required" }
            }

            Invoke-ByName $window '練習'
            $names = Get-Names $window
            foreach ($required in @('安全な練習エリア','練習完了 → テストへ')) {
              if (-not ($names -contains $required)) { Save-Screenshot 'artifacts/education-practice-failure.png'; throw "Education practice UI missing: $required" }
            }

            Invoke-ByName $window 'テスト'
            $names = Get-Names $window
            if (-not ($names -contains 'テストはまだ開始できません。')) { Save-Screenshot 'artifacts/education-gating-failure.png'; throw 'Education test gating did not block an unpracticed lesson.' }

            Invoke-ByName $window '教育'
            Save-Screenshot 'artifacts/education-home.png'
          }
          finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Upload Education smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpsys-education-smoke
          path: artifacts/*.png
          if-no-files-found: warn
