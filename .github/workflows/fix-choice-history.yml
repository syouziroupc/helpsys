name: Fix choice history resolution

on:
  push:
    branches:
      - fix/choice-replan-recovery-20260913

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/choice-replan-recovery-20260913
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic choice patch
        run: python3 tools/fix_choice_history.py

      - name: Syntax and regression tests
        run: |
          npm run check
          npm test

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'HelpSys Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add worker/windows-knowledge.js worker/quality-guide-selftest.mjs
          git commit -m '[auto-choice-fix] Make quality choice resolution history-aware'
          git push origin HEAD:fix/choice-replan-recovery-20260913
