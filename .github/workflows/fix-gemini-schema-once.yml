name: Fix Gemini schema once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-gemini-schema-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch production Outlaw Gemini structured-output field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/outlaw-guide.js')
          s = p.read_text(encoding='utf-8')
          old = 'responseSchema: tool.parameters'
          new = 'responseJsonSchema: tool.parameters'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          node --check worker/outlaw-guide.js
          grep -q 'responseJsonSchema: tool.parameters' worker/outlaw-guide.js
          if grep -q 'responseSchema: tool.parameters' worker/outlaw-guide.js; then
            echo 'legacy responseSchema still present'
            exit 1
          fi

      - name: Commit production Worker fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/outlaw-guide.js
          git commit -m 'Fix production Outlaw Gemini JSON Schema adapter'
          git push origin HEAD:main
