name: Fix local account choice

on:
  push:
    branches:
      - fix/choice-replan-recovery-20260913

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/choice-replan-recovery-20260913
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply local account-choice patch
        shell: pwsh
        run: python tools/fix_local_choice.py

      - name: Local-choice privacy contract
        run: node tests/local-choice-contract.mjs

      - name: Existing Worker regressions
        run: |
          npm run check
          npm test

      - name: Restore and build Windows desktop
        run: |
          dotnet restore src/HelpSys.Desktop/HelpSys.Desktop.csproj
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true

      - name: Commit verified local resolver
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          git config user.name 'HelpSys Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/HelpSys.Desktop/MainWindow.xaml.cs src/HelpSys.Desktop/MainWindow.ReliabilityV3.cs src/HelpSys.Desktop/MainWindow.LocalChoiceResolver.cs tests/local-choice-contract.mjs
          git commit -m '[auto-local-choice-fix] Resolve account choices locally without raw identity egress'
          git push origin HEAD:fix/choice-replan-recovery-20260913
