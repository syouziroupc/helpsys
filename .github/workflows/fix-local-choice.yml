name: Verify sequential HelpSys fixes

on:
  push:
    branches:
      - fix/choice-replan-recovery-20260913

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/choice-replan-recovery-20260913
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply local account-choice patches idempotently
        shell: pwsh
        run: |
          python tools/fix_local_choice.py
          python tools/fix_local_choice_extended.py
          python tools/fix_local_choice_contract.py

      - name: Apply off-route click regression patch idempotently
        shell: pwsh
        run: python tools/fix_off_route_click.py

      - name: Apply bounded current-state replan patch
        shell: pwsh
        run: python tools/fix_current_state_replan.py

      - name: Focused contracts
        run: |
          node tests/local-choice-contract.mjs
          node tests/current-state-replan-contract.mjs

      - name: Existing Worker and desktop contracts
        run: |
          npm run check
          npm test

      - name: Restore and build Windows desktop
        run: |
          dotnet restore src/HelpSys.Desktop/HelpSys.Desktop.csproj
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true

      - name: Commit verified sequential fixes
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          git config user.name 'HelpSys Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/HelpSys.Desktop/MainWindow.xaml.cs src/HelpSys.Desktop/MainWindow.LiveGuidance.cs src/HelpSys.Desktop/MainWindow.ReliabilityV3.cs src/HelpSys.Desktop/MainWindow.LocalChoiceResolver.cs src/HelpSys.Desktop/MainWindow.DeepAuditGuards.cs src/HelpSys.Desktop/MainWindow.QualityFirst.cs src/HelpSys.Desktop/MainWindow.CurrentStateReplan.cs tests/local-choice-contract.mjs tests/deep-audit-contract.mjs tests/current-state-replan-contract.mjs
          git commit -m '[auto-current-state-replan] Replan transient UI drift before route recovery'
          git push origin HEAD:fix/choice-replan-recovery-20260913

# Product files are committed only after focused contracts, existing regressions, and the Windows build pass.
