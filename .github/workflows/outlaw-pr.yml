name: Outlaw desktop PR validation

on:
  pull_request:
    branches: [experimental/outlaw-operation-first-20260923]
    paths:
      - "src/HelpSys.Desktop/**"
      - "src/Shared/**"
      - "tests/outlaw-*.mjs"
      - "tests/current-state-replan-contract.mjs"
      - ".github/workflows/outlaw-pr.yml"
      - ".github/workflows/outlaw-release.yml"

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Outlaw progressive observation
        run: |
          node tests/outlaw-observation-contract.mjs
          node tests/outlaw-universal-navigator-contract.mjs
          node tests/outlaw-provider-contract.mjs
          node tests/local-choice-contract.mjs
          node tests/outlaw-repeat-guard-contract.mjs
          node tests/current-state-replan-contract.mjs
          node tests/outlaw-update-contract.mjs
          node tests/outlaw-3.2.0-grounding-contract.mjs
          node tests/outlaw-3.2.1-shell-surface-contract.mjs
          node tests/outlaw-3.2.2-launch-replan-contract.mjs
          node tests/outlaw-3.2.3-crash-update-contract.mjs

      - name: Restore
        run: dotnet restore src/HelpSys.Desktop/HelpSys.Desktop.csproj

      - name: Build Outlaw desktop
        run: dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore
