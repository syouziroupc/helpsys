name: Publish HelpSys Outlaw Windows build

on:
  push:
    branches: [experimental/outlaw-operation-first-20260923]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helpsys-outlaw-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Outlaw observation contract
        continue-on-error: true
        run: node tests/outlaw-observation-contract.mjs

      - name: Verify Outlaw repeat guard
        continue-on-error: true
        run: node tests/outlaw-repeat-guard-contract.mjs

      - name: Verify bounded current-state replanning
        continue-on-error: true
        run: node tests/current-state-replan-contract.mjs

      - name: Verify tri-state action effects
        continue-on-error: true
        run: node tests/action-verification-contract.mjs

      - name: Verify per-monitor overlay DPI
        continue-on-error: true
        run: node tests/overlay-dpi-contract.mjs

      - name: Verify swappable brain and direct-choice UI
        continue-on-error: true
        run: |
          node --check worker/quality-guide.js
          node --check worker/reliability-v4-guard.js
          node worker/quality-guide-selftest.mjs
          node tests/local-choice-contract.mjs

      - name: Check deployed Outlaw API generation
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const base='https://helpsys.syouziroupc.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let health=null;
          for(let i=0;i<15;i++){
            try{
              const r=await fetch(base+'/health/outlaw',{cache:'no-store'});
              if(r.ok){
                const j=await r.json();
                if(j?.ok===true &&
                   j?.service==='helpsys-outlaw' &&
                   j?.version==='outlaw-2026.09.24-r3.6' &&
                   j?.aiConfigured===true &&
                   Array.isArray(j?.providers) &&
                   ['auto','gemini','glm'].every(x=>j.providers.includes(x))){
                  health=j; break;
                }
              }
            }catch{}
            await sleep(4000);
          }
          if(!health) throw new Error('Production Outlaw API did not reach r3.4 before desktop release.');

          const body={
            request:'設定を開く次の操作を案内して',
            aiProvider:'glm',
            history:[],
            systemContext:{
              foregroundProcess:'explorer',
              foregroundTitle:'デスクトップ',
              foregroundProcessId:1234,
              taskbarVisible:true,
              runningApps:['explorer'],
              browser:null
            },
            evidence:{screenshotPresent:false},
            elements:[{
              id:'u1',name:'スタート',automationId:'Start',className:'',
              controlType:'Button',processName:'explorer',interactable:true,
              enabled:true,keyboardFocusable:true,focused:false,password:false,
              processId:1234,value:null,toggleState:null,selected:null,
              expandCollapseState:null,x:0,y:0,width:80,height:40
            }]
          };
          const r=await fetch(base+'/v1/outlaw-plan',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify(body)
          });
          const text=await r.text();
          if(!r.ok) throw new Error('Production Outlaw API HTTP '+r.status+': '+text.slice(0,400));
          const parsed=JSON.parse(text);
          if(!['target','clarify','done','not_found'].includes(parsed?.status))
            throw new Error('Production Outlaw API returned invalid planner response.');
          console.log('production_outlaw_health',JSON.stringify(health));
          console.log('production_outlaw_glm_smoke',JSON.stringify(parsed));
          NODE

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Build outlaw edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore

      - name: Build Outlaw real-click smoke edition
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'smoke-bin/normal' | Out-Null
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true -o smoke-bin/normal
          if (-not (Test-Path 'smoke-bin/normal/HelpSys.exe')) { throw 'Outlaw smoke executable was not produced.' }

      - name: Verify Outlaw real mouse guidance
        continue-on-error: true
        shell: pwsh
        run: ./tests/real_click_guidance_smoke.ps1

      - name: Publish outlaw Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'publish\outlaw-win-x64'
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $version = '3.1.5'
          $versionedName = "HelpSys-Outlaw-$version-$shortSha-win-x64.zip"
          $stableName = 'HelpSys-Outlaw-latest-win-x64.zip'

          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -p:HelpSysBuildId="outlaw-$shortSha" `
            -o $out

          if (-not (Test-Path (Join-Path $out 'HelpSys.exe'))) { throw 'Outlaw HelpSys executable was not produced.' }
          Copy-Item README.md (Join-Path $out 'README.md')
          @"
          HelpSys Outlaw
          Version: 3.1.5
          Build: $shortSha
          Channel: outlaw-latest
          "@ | Set-Content -Encoding UTF8 (Join-Path $out 'VERSION.txt')
          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $PWD $versionedName) -Force
          Copy-Item (Join-Path $PWD $versionedName) (Join-Path $PWD $stableName) -Force
          "HELPSYS_VERSIONED_ASSET=$versionedName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HELPSYS_STABLE_ASSET=$stableName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update outlaw-latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'outlaw-latest'
          $versioned = Join-Path $PWD $env:HELPSYS_VERSIONED_ASSET
          $stable = Join-Path $PWD $env:HELPSYS_STABLE_ASSET

          $notes = @"
          HelpSys Outlaw — operation-first experimental build

          - Privacy/Sentinel blocking and screenshot redaction disabled in this edition
          - Full-monitor screenshots up to 2560x1440
          - Full-desktop UI Automation observation: up to 1200 candidates / 18000 visited nodes / 18 levels / 4.5 seconds, with planner-side goal ranking
          - UIA TextPattern semantic text extraction enabled
          - Visual-only targets are retained even when UIA exposes no matching control
          - Cross-process foreground changes are watched globally; background object-event noise is filtered
          - Failed actions are blocked from being re-presented on the same observed state
          - Recovery/replan budgets reset only after verified progress
          - Up to 64 guidance-history entries are retained
          - Screenshots, evidence JSON, decisions, and runtime logs are written under %LOCALAPPDATA%\HelpSys\logs
          - Dedicated Outlaw cloud planner with bounded client deadlines and Auto / GLM reasoning with Gemini disabled until configured
          - Version 3.1.5 / build $($env:GITHUB_SHA.Substring(0, 8))
          - Windows 10 / 11 x64 self-contained
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $versioned $stable --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload outlaw release assets.' }
            gh release edit $tag --target $env:GITHUB_SHA --title "HelpSys Outlaw Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $versioned $stable --target $env:GITHUB_SHA --title "HelpSys Outlaw Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create outlaw release.' }
          }

      - name: Verify published pilot release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'outlaw-latest'
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish,assets,url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read outlaw-latest after publish.' }
          $release = $json | ConvertFrom-Json
          $assets = @($release.assets | ForEach-Object { $_.name })
          if (-not [string]::Equals([string]$release.targetCommitish, [string]$env:GITHUB_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "outlaw-latest points to $($release.targetCommitish), expected $env:GITHUB_SHA"
          }
          if ($assets -notcontains $env:HELPSYS_STABLE_ASSET) {
            throw "Stable pilot asset missing: $env:HELPSYS_STABLE_ASSET"
          }
          if ($assets -notcontains $env:HELPSYS_VERSIONED_ASSET) {
            throw "Versioned pilot asset missing: $env:HELPSYS_VERSIONED_ASSET"
          }
          Write-Host "Published $tag -> $($release.targetCommitish)"
          Write-Host "Release URL: $($release.url)"
          Write-Host "Assets: $($assets -join ', ')"
