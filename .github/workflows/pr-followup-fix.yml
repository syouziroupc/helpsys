name: PR follow-up fixes

on:
  push:
    branches: [fix/recognition-latency-state-20260914]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[followup-fixed]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recognition-latency-state-20260914
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply narrow fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          privacy = Path('src/HelpSys.Desktop/Services/PrivacyGate.cs')
          s = privacy.read_text(encoding='utf-8')
          old = 'if (ContainsAny(texts, PasswordManagerTerms))'
          new = 'if (browserUrl.Contains("://password", StringComparison.OrdinalIgnoreCase) || ContainsAny(texts, PasswordManagerTerms))'
          if s.count(old) != 1:
              raise SystemExit(f'password-route anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = 'if (ContainsAny(texts, OtpTerms) && (hasOrdinaryInput || HasSensitiveInputSemantic(elements, OtpTerms)))'
          new = 'if (ContainsAny(texts, OtpTerms) && (hasOrdinaryInput || HasSensitiveInputSemantic(elements, OtpTerms) || (ContainsAny(new[] { systemContext.ForegroundTitle ?? string.Empty }, OtpTerms) && ContainsAny(new[] { systemContext.ForegroundTitle ?? string.Empty }, new[] { "enter", "type", "verify", "入力", "認証", "確認" }))))'
          if s.count(old) != 1:
              raise SystemExit(f'OTP anchor count={s.count(old)}')
          privacy.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          update = Path('src/HelpSys.Desktop/MainWindow.Update.cs')
          s = update.read_text(encoding='utf-8')
          old = 'SetState("新しいHelpSysがあります。「更新する」を押すと自動で入れ替えて再起動します。", speak: false);'
          new = 'if (announceWhenCurrent) SetState("新しいHelpSysがあります。「更新する」を押すと自動で入れ替えて再起動します。", speak: false);'
          if s.count(old) != 1:
              raise SystemExit(f'Update anchor count={s.count(old)}')
          update.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          for rel in ['tests/commander-stability-contract.mjs', 'tests/privacy-contract.mjs']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              old = 'AttemptTimeout = TimeSpan.FromSeconds(9)'
              if s.count(old) != 1:
                  raise SystemExit(f'{rel}: timeout anchor count={s.count(old)}')
              p.write_text(s.replace(old, 'AttemptTimeout = TimeSpan.FromSeconds(6)', 1), encoding='utf-8', newline='\n')
          '@ | python -
      - name: Verify fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/commander-stability-contract.mjs
          node tests/privacy-contract.mjs
          dotnet restore HelpSys.sln
          dotnet build HelpSys.sln -c Release --no-restore
          dotnet run --project tests/HelpSys.PrivacyProbe/HelpSys.PrivacyProbe.csproj -c Release -- --expect-safe-profile
      - name: Commit and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/pr-followup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/pr-followup-fix.yml
          git commit -m '[followup-fixed] Restore privacy hard-blocks, isolate update status, and align latency contracts'
          git push origin HEAD:fix/recognition-latency-state-20260914
