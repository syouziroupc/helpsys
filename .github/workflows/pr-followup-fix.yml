name: PR follow-up fixes

on:
  push:
    branches: [fix/recognition-latency-state-20260914]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[followup-fixed]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recognition-latency-state-20260914
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply narrow fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          privacy = Path('src/HelpSys.Desktop/Services/PrivacyGate.cs')
          s = privacy.read_text(encoding='utf-8')
          old = '''            if (ContainsAny(texts, OtpTerms) && (hasOrdinaryInput || HasSensitiveInputSemantic(elements, OtpTerms)))
                  return Remember(Block("otp_or_mfa", "認証コード・二段階認証の入力画面ではクラウド画面解析を停止します。"));'''
          new = '''            var otpTitle = systemContext.ForegroundTitle ?? string.Empty;
              var otpPromptTitle = ContainsAny(new[] { otpTitle }, OtpTerms) &&
                                   ContainsAny(new[] { otpTitle }, new[] { "enter", "type", "verify", "入力", "認証", "確認" });
              if (ContainsAny(texts, OtpTerms) && (hasOrdinaryInput || HasSensitiveInputSemantic(elements, OtpTerms) || otpPromptTitle))
                  return Remember(Block("otp_or_mfa", "認証コード・二段階認証の入力画面ではクラウド画面解析を停止します。"));'''
          if s.count(old) != 1:
              raise SystemExit(f'OTP anchor count={s.count(old)}')
          privacy.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          update = Path('src/HelpSys.Desktop/MainWindow.Update.cs')
          s = update.read_text(encoding='utf-8')
          old = '''            UpdateButton.Content = "更新する";
              UpdateButton.ToolTip = $"HelpSys {update.BuildId} へ更新します";
              SetState("新しいHelpSysがあります。「更新する」を押すと自動で入れ替えて再起動します。", speak: false);'''
          new = '''            UpdateButton.Content = "更新する";
              UpdateButton.ToolTip = $"HelpSys {update.BuildId} へ更新します";
              if (announceWhenCurrent)
                  SetState("新しいHelpSysがあります。「更新する」を押すと自動で入れ替えて再起動します。", speak: false);'''
          if s.count(old) != 1:
              raise SystemExit(f'Update anchor count={s.count(old)}')
          update.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
      - name: Verify fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore HelpSys.sln
          dotnet build HelpSys.sln -c Release --no-restore
          dotnet run --project tests/HelpSys.PrivacyProbe/HelpSys.PrivacyProbe.csproj -c Release --no-build -- --expect-safe-profile
      - name: Commit and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/pr-followup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/pr-followup-fix.yml
          git commit -m '[followup-fixed] Restore OTP hard-block and isolate update status'
          git push origin HEAD:fix/recognition-latency-state-20260914
