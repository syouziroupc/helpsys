name: Probe HelpSys Outlaw Production

on:
  push:
    branches: [main]
    paths:
      - "worker/outlaw-guide.js"
      - "worker/stable-router.js"
      - "wrangler.jsonc"
      - ".github/workflows/probe-outlaw-production.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe production Outlaw health
        shell: bash
        run: |
          node <<'NODE'
          const base='https://helpsys.syouziroupc.workers.dev';
          const expected='outlaw-2026.09.23-r1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<20;i++){
            try{
              const r=await fetch(base+'/health/outlaw',{cache:'no-store'});
              last=await r.text();
              console.log('attempt',i+1,'status',r.status,'body',last.slice(0,500));
              if(r.ok){
                const j=JSON.parse(last);
                if(j?.ok===true && j?.service==='helpsys-outlaw' && j?.version===expected && j?.aiConfigured===true){
                  console.log('OUTLAW_PRODUCTION_READY');
                  process.exit(0);
                }
              }
            }catch(e){
              last=String(e);
              console.log('attempt',i+1,'error',last);
            }
            await sleep(6000);
          }
          throw new Error('Outlaw production did not converge. Last result: '+last.slice(0,500));
          NODE
