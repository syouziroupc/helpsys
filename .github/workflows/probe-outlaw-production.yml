name: Probe HelpSys Outlaw Production

on:
  push:
    branches: [main]
    paths:
      - "worker/outlaw-guide.js"
      - "worker/stable-router.js"
      - "wrangler.jsonc"
      - ".github/workflows/probe-outlaw-production.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe production Outlaw health and inference
        shell: bash
        run: |
          node <<'NODE'
          const base='https://helpsys.syouziroupc.workers.dev';
          const expected='outlaw-2026.09.23-r3.1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let health=null;
          let last='';
          for(let i=0;i<20;i++){
            try{
              const r=await fetch(base+'/health/outlaw',{cache:'no-store'});
              last=await r.text();
              console.log('attempt',i+1,'status',r.status,'body',last.slice(0,500));
              if(r.ok){
                const j=JSON.parse(last);
                if(j?.ok===true &&
                   j?.service==='helpsys-outlaw' &&
                   j?.version===expected &&
                   j?.aiConfigured===true &&
                   j?.maxUiElements===2400 &&
                   j?.maxHistory===64 &&
                   j?.reasoningEffort==='high' &&
                   j?.maxCompletionTokens===2400 &&
                   j?.dualStageVisionReview===true &&
                   j?.visionModel==='@cf/zai-org/glm-5.3-flash' &&
                   j?.reasoningModel==='@cf/zai-org/glm-5.3'){
                  health=j;
                  console.log('OUTLAW_PRODUCTION_READY');
                  break;
                }
              }
            }catch(e){
              last=String(e);
              console.log('attempt',i+1,'error',last);
            }
            await sleep(6000);
          }
          if(!health) throw new Error('Outlaw production did not converge. Last result: '+last.slice(0,500));

          const image='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZlD8AAAAASUVORK5CYII=';
          const body={
            request:'スタートボタンから設定を開く次の操作を案内して',
            image,
            history:[],
            systemContext:{
              foregroundProcess:'explorer',
              foregroundTitle:'デスクトップ',
              foregroundProcessId:1234,
              taskbarVisible:true,
              runningApps:['explorer'],
              browser:null
            },
            evidence:{screenshotPresent:false},
            elements:[
              {
                id:'u1',
                name:'スタート',
                automationId:'Start',
                className:'StartButton',
                controlType:'Button',
                processName:'explorer',
                interactable:true,
                enabled:true,
                keyboardFocusable:true,
                focused:false,
                password:false,
                processId:1234,
                value:null,
                toggleState:null,
                selected:null,
                expandCollapseState:null,
                x:10,y:10,width:80,height:40
              }
            ]
          };

          const started=Date.now();
          const response=await fetch(base+'/v1/outlaw-plan',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify(body)
          });
          const raw=await response.text();
          const elapsed=Date.now()-started;
          console.log('outlaw_plan_status',response.status,'elapsedMs',elapsed,'body',raw.slice(0,1200));
          if(!response.ok)
            throw new Error('Outlaw planner live inference failed: '+response.status+' '+raw.slice(0,500));

          let parsed;
          try{parsed=JSON.parse(raw)}catch{throw new Error('Outlaw planner returned non-JSON');}
          if(!['target','clarify','done','not_found'].includes(parsed?.status))
            throw new Error('Outlaw planner returned invalid status');
          if(parsed.status==='target' && !['u1','vision-target'].includes(parsed?.targetId))
            throw new Error('Outlaw planner returned unknown targetId: '+String(parsed?.targetId));
          if(parsed?.screenConfirmed===true)
            throw new Error('Blank 1x1 image must not become screenConfirmed=true after text-only review');
          console.log('OUTLAW_LIVE_INFERENCE_OK');
          NODE
