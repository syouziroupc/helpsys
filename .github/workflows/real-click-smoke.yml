name: Real mouse guidance smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  real-click:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore
        run: dotnet restore src/HelpSys.Desktop/HelpSys.Desktop.csproj
      - name: Build unified CI test edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'smoke-bin/normal' | Out-Null
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true -o smoke-bin/normal
          if (-not (Test-Path 'smoke-bin/normal/HelpSys.exe')) { throw 'Unified smoke executable was not produced.' }
      - name: Ensure screen recorder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Record real HelpSys usage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $video = Join-Path $PWD 'artifacts\helpsys-real-usage.mp4'
          $recordArgs = @(
            '-y',
            '-f','gdigrab',
            '-framerate','15',
            '-draw_mouse','1',
            '-i','desktop',
            '-t','35',
            '-c:v','libx264',
            '-preset','ultrafast',
            '-crf','25',
            '-pix_fmt','yuv420p',
            $video
          )
          $recorder = Start-Process ffmpeg -ArgumentList $recordArgs -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            ./tests/real_click_guidance_smoke.ps1
          }
          finally {
            if (-not $recorder.HasExited) {
              try { Wait-Process -Id $recorder.Id -Timeout 38 -ErrorAction Stop } catch {
                Stop-Process -Id $recorder.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
          if (-not (Test-Path $video)) { throw 'HelpSys real-usage video was not produced.' }
          if ((Get-Item $video).Length -lt 100000) { throw 'HelpSys real-usage video is unexpectedly small.' }
      - name: Validate YouTube E2E script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tests/youtube_real_usage_e2e.ps1'),
            [ref]$null,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'YouTube E2E PowerShell parser errors detected.'
          }

      - name: Record real YouTube HelpSys session
        shell: pwsh
        continue-on-error: true
        env:
          HELPSYS_API_BASE: https://refactor-why5-root-cause-v10-helpsys.syouziroupc.workers.dev
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $video = Join-Path $PWD 'artifacts\\helpsys-youtube-real-usage.mp4'
          $recordArgs = @(
            '-y',
            '-f','gdigrab',
            '-framerate','15',
            '-draw_mouse','1',
            '-i','desktop',
            '-t','110',
            '-c:v','libx264',
            '-preset','ultrafast',
            '-crf','25',
            '-pix_fmt','yuv420p',
            $video
          )
          $recorder = Start-Process ffmpeg -ArgumentList $recordArgs -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            ./tests/youtube_real_usage_e2e.ps1
          }
          finally {
            if (-not $recorder.HasExited) {
              try { Wait-Process -Id $recorder.Id -Timeout 112 -ErrorAction Stop } catch {
                Stop-Process -Id $recorder.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
          if (-not (Test-Path $video)) { throw 'YouTube real-usage video was not produced.' }

      - name: Reject non-client candidate noise
        shell: pwsh
        run: ./tests/real_click_candidate_noise_check.ps1
      - name: Upload real-click smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpsys-real-click-smoke
          path: |
            artifacts/helpsys-real-click-*.png
            artifacts/helpsys-real-click-*.json
            artifacts/helpsys-real-usage.mp4
            artifacts/helpsys-youtube-real-usage.mp4
            artifacts/helpsys-youtube-e2e.json
            artifacts/mock-last-request.json
          if-no-files-found: warn
