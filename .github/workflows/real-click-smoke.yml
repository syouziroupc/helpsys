name: Real mouse guidance smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  real-click:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore
        run: dotnet restore src/HelpSys.Desktop/HelpSys.Desktop.csproj
      - name: Build unified CI test edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'smoke-bin/normal' | Out-Null
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true -o smoke-bin/normal
          if (-not (Test-Path 'smoke-bin/normal/HelpSys.exe')) { throw 'Unified smoke executable was not produced.' }
      - name: Real physical Guide click smoke
        shell: pwsh
        run: ./tests/real_click_guidance_smoke.ps1
      - name: Upload real-click smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpsys-real-click-smoke
          path: |
            artifacts/helpsys-real-click-*.png
            artifacts/helpsys-real-click-*.json
            artifacts/mock-last-request.json
          if-no-files-found: warn
