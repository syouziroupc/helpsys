name: Recognition latency repair

on:
  push:
    branches: [fix/recognition-latency-state-20260914]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recognition-latency-state-20260914
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply repair
        shell: pwsh
        run: python tools/apply_recognition_latency_fix.py

      - name: Run focused regression contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/recognition-latency-contract.mjs
          node tests/current-state-replan-contract.mjs
          node tests/ui-surface-contract.mjs
          node tests/deep-audit-contract.mjs
          node worker/quality-guide-selftest.mjs
          node worker/selftest.mjs

      - name: Build Windows solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore HelpSys.sln
          dotnet build HelpSys.sln -c Release --no-restore

      - name: Commit verified repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) { throw 'Repair produced no source changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src worker tests
          git commit -m '[auto-fix] Improve screen text recognition, latency, and state stability'
          git push origin HEAD:fix/recognition-latency-state-20260914
