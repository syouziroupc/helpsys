name: Publish Windows preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helpsys-preview-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Verify release and privacy contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/site-release-contract.mjs
          node tests/privacy-contract.mjs
          node tests/privacy-capability-contract.mjs
          node tests/worker-data-handling-contract.mjs

      - name: Publish unified Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'publish\win-x64'
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $versionedName = "HelpSys-Unified-$shortSha-win-x64.zip"
          $stableName = 'HelpSys-latest-win-x64.zip'

          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o $out

          if (-not (Test-Path (Join-Path $out 'HelpSys.exe'))) { throw 'Unified HelpSys executable was not produced.' }
          Copy-Item README.md (Join-Path $out 'README.md')
          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $PWD $versionedName) -Force
          Copy-Item (Join-Path $PWD $versionedName) (Join-Path $PWD $stableName) -Force
          "HELPSYS_VERSIONED_ASSET=$versionedName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HELPSYS_STABLE_ASSET=$stableName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update preview-latest release atomically
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'preview-latest'
          $versioned = Join-Path $PWD $env:HELPSYS_VERSIONED_ASSET
          $stable = Join-Path $PWD $env:HELPSYS_STABLE_ASSET
          $allowedAssets = @($env:HELPSYS_VERSIONED_ASSET, $env:HELPSYS_STABLE_ASSET)

          $notes = @"
          HelpSys Windows Preview — Unified secure build

          - Windows 10 / 11 (64-bit), self-contained
          - Stable download alias: $($env:HELPSYS_STABLE_ASSET)
          - Traceable build: $($env:HELPSYS_VERSIONED_ASSET)
          - Normal/Safe editions are unified into one binary
          - Safe Privacy Gate policy is the standard profile
          - Password / OTP / token / API key / Cookie/Storage / financial-auth states fail closed
          - Cloud transport rejects redirects/cookies/proxy inheritance and pins external traffic to the reviewed HelpSys origin
          - Voice/Commander is available only after an explicit user action or local wake phrase
          - HelpSys remains guidance-only and does not click, type, pay, or enter credentials
          - This release is rebuilt automatically on every main-branch update
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldAssets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
            foreach ($oldAsset in $oldAssets) {
              if ($oldAsset -like 'HelpSys*.zip' -and $allowedAssets -notcontains $oldAsset) {
                gh release delete-asset $tag $oldAsset --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale release asset: $oldAsset" }
              }
            }
            gh release upload $tag $versioned $stable --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload unified preview assets.' }
            gh release edit $tag --target main --title "HelpSys Windows Preview" --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $versioned $stable --target main --title "HelpSys Windows Preview" --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create unified preview release.' }
          }

          $published = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($expected in $allowedAssets) {
            if ($published -notcontains $expected) { throw "Release asset missing after publish: $expected" }
          }
