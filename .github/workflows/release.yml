name: Publish Windows preview

on:
  push:
    branches: [main]
    paths:
      - "src/HelpSys.Desktop/**"
      - "HelpSys.sln"
      - "README.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'publish\win-x64'
          $assetName = 'HelpSys-Reliability-v9-win-x64.zip'
          $stableAssetName = 'HelpSys-latest-win-x64.zip'
          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o $out
          Copy-Item README.md (Join-Path $out 'README.md')
          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $PWD $assetName) -Force
          Copy-Item (Join-Path $PWD $assetName) (Join-Path $PWD $stableAssetName) -Force

      - name: Update preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'preview-latest'
          $assetName = 'HelpSys-Reliability-v9-win-x64.zip'
          $stableAssetName = 'HelpSys-latest-win-x64.zip'
          $asset = Join-Path $PWD $assetName
          $stableAsset = Join-Path $PWD $stableAssetName
          $allowedAssets = @($assetName, $stableAssetName)
          $notes = @"
          HelpSys Windows Preview — Reliability v9

          - Windows 10 / 11 (64-bit)
          - Self-contained build
          - Versioned package: $assetName
          - Stable site download alias: $stableAssetName
          - Commander: 起動語の軽量ローカル待機は維持し、用件の文字起こしをWorkers AI Whisper large-v3-turboへ変更
          - Commander: 16 kHz mono録音、無音区間で自動終了、日本語指定・VAD付きASR
          - Commander UI: 聞き取り中・文字起こし中・確定文字列を画面上端中央のオーバーレイへ表示
          - 画面確認: 画像取得または視覚確認が弱い場合、同じ前面プロセスのUI Automationを再走査して具体的な操作対象だけ継続可能に変更
          - 安全性: 完了判定、画像だけの座標、秘密情報ガード、stale response破棄は従来どおり厳格に維持
          - GLM: Quality FirstはGLM-5.3 Flash、通常テキスト経路はGLM-4.7 Flashを維持
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldAssets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
            foreach ($oldAsset in $oldAssets) {
              if ($oldAsset -like 'HelpSys*.zip' -and $allowedAssets -notcontains $oldAsset) {
                gh release delete-asset $tag $oldAsset --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale release asset: $oldAsset" }
              }
            }
            gh release upload $tag $asset $stableAsset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload preview assets.' }
            gh release edit $tag --title "HelpSys Windows Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $asset $stableAsset --target main --title "HelpSys Windows Preview" --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          }

          $published = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($expected in $allowedAssets) {
            if ($published -notcontains $expected) { throw "Release asset missing after publish: $expected" }
          }
