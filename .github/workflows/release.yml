name: Publish Windows preview

on:
  push:
    branches: [main]
    paths:
      - "src/HelpSys.Desktop/**"
      - "HelpSys.sln"
      - "README.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'publish\win-x64'
          $assetName = 'HelpSys-Reliability-v5-win-x64.zip'
          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o $out
          Copy-Item README.md (Join-Path $out 'README.md')
          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $PWD $assetName) -Force

      - name: Update preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'preview-latest'
          $assetName = 'HelpSys-Reliability-v5-win-x64.zip'
          $asset = Join-Path $PWD $assetName
          $notes = @"
          HelpSys Windows Preview — Reliability v5

          - Windows 10 / 11 (64-bit)
          - Self-contained build
          - Package: $assetName
          - Reliability v5: 前面アプリ切替時のUI Automation監視競合を修正
          - 起動直後のWindow購読を再試行し、同一プロセスではフォーカス中の可視Windowを優先
          - 操作代行ではなく、現在状態を確認して人間が行う次の1手を案内する開発版です。
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Do not leave a differently named old HelpSys ZIP next to the current build.
            $oldAssets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
            foreach ($oldAsset in $oldAssets) {
              if ($oldAsset -like 'HelpSys*.zip' -and $oldAsset -ne $assetName) {
                gh release delete-asset $tag $oldAsset --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale release asset: $oldAsset" }
              }
            }
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload preview asset.' }
            gh release edit $tag --title "HelpSys Windows Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $asset --target main --title "HelpSys Windows Preview" --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          }
