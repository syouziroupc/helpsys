name: Publish Windows preview

on:
  push:
    branches: [main]
    paths:
      - "src/HelpSys.Desktop/**"
      - "src/Shared/**"
      - "docs/AI_PROVIDER_PRIVACY_REVIEW.md"
      - "site/**"
      - "tests/site-release-contract.mjs"
      - "HelpSys.sln"
      - "README.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Verify Safe preview release contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/site-release-contract.mjs
          $adapter = Get-Content 'src/Shared/CloudAiAdapter.cs' -Raw
          if ($adapter -notmatch 'HELPSYS_SAFE_API_BASE') { throw 'Safe build lost explicit-only endpoint configuration.' }
          if ($adapter -notmatch '_apiBase = string\.IsNullOrWhiteSpace\(resolvedBase\) \? null') { throw 'Safe build no longer fails closed when its endpoint is absent.' }

      - name: Publish normal and Safe Windows builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $normalOut = Join-Path $PWD 'publish\normal-win-x64'
          $safeOut = Join-Path $PWD 'publish\safe-win-x64'
          $normalAssetName = 'HelpSys-Reliability-v9-win-x64.zip'
          $normalStableName = 'HelpSys-latest-win-x64.zip'
          $safeAssetName = 'HelpSys-Safe-v1-win-x64.zip'
          $safeStableName = 'HelpSys-Safe-latest-win-x64.zip'

          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o $normalOut

          dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:SafeBuild=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o $safeOut

          if (-not (Test-Path (Join-Path $safeOut 'HelpSys.Safe.exe'))) { throw 'Safe executable was not produced.' }
          Copy-Item README.md (Join-Path $normalOut 'README.md')
          Copy-Item README.md (Join-Path $safeOut 'README.md')
          Compress-Archive -Path "$normalOut\*" -DestinationPath (Join-Path $PWD $normalAssetName) -Force
          Compress-Archive -Path "$safeOut\*" -DestinationPath (Join-Path $PWD $safeAssetName) -Force
          Copy-Item (Join-Path $PWD $normalAssetName) (Join-Path $PWD $normalStableName) -Force
          Copy-Item (Join-Path $PWD $safeAssetName) (Join-Path $PWD $safeStableName) -Force

      - name: Update preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'preview-latest'
          $normalAssetName = 'HelpSys-Reliability-v9-win-x64.zip'
          $normalStableName = 'HelpSys-latest-win-x64.zip'
          $safeAssetName = 'HelpSys-Safe-v1-win-x64.zip'
          $safeStableName = 'HelpSys-Safe-latest-win-x64.zip'
          $normalAsset = Join-Path $PWD $normalAssetName
          $normalStable = Join-Path $PWD $normalStableName
          $safeAsset = Join-Path $PWD $safeAssetName
          $safeStable = Join-Path $PWD $safeStableName
          $providerApproved = Select-String -Path 'docs/AI_PROVIDER_PRIVACY_REVIEW.md' -Pattern '^SAFE_RELEASE_STATUS: APPROVED$' -Quiet
          $binaryPreviewAllowed = Select-String -Path 'docs/AI_PROVIDER_PRIVACY_REVIEW.md' -Pattern '^SAFE_BINARY_PREVIEW_STATUS: ALLOWED_WITH_DEFAULT_EGRESS_OFF$' -Quiet
          if (-not $binaryPreviewAllowed) { throw 'Safe binary preview release is not authorized by the privacy review.' }

          $allowedAssets = @($normalAssetName, $normalStableName, $safeAssetName, $safeStableName)
          $safeNote = if ($providerApproved) {
            '- Safe Preview: provider-connected operation approved by the current privacy review.'
          } else {
            '- Safe Preview: public binary has no default Safe cloud endpoint; provider-connected Safe operation remains under privacy review.'
          }

          $notes = @"
          HelpSys Windows Preview — Privacy Gate architecture

          - Windows 10 / 11 (64-bit), self-contained
          - Normal package: $normalAssetName
          - Existing stable download alias: $normalStableName
          - Safe Preview package: $safeAssetName
          - Safe stable download alias: $safeStableName
          $safeNote
          - Safe cloud voice / Commander transcription is disabled
          - Screen acquisition, cloud egress and persistence are separated
          - All screen-derived cloud requests pass through the local Privacy Gate
          - Password / OTP / token / API-key / browser storage / financial-auth states fail closed
          - BLOCKED or UNKNOWN enters Privacy Mode without ending HelpSys; safe-screen return resumes guidance
          - Cloud HTTP transport is centralized in the replaceable CloudAiAdapter
          - HelpSys remains guidance-only: it does not click, type, modify files/settings, pay or enter credentials
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldAssets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
            foreach ($oldAsset in $oldAssets) {
              if ($oldAsset -like 'HelpSys*.zip' -and $allowedAssets -notcontains $oldAsset) {
                gh release delete-asset $tag $oldAsset --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale release asset: $oldAsset" }
              }
            }

            gh release upload $tag $normalAsset $normalStable $safeAsset $safeStable --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload preview assets.' }
            gh release edit $tag --title "HelpSys Windows Preview" --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $normalAsset $normalStable $safeAsset $safeStable --target main --title "HelpSys Windows Preview" --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create preview release.' }
          }

          $published = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($expected in $allowedAssets) {
            if ($published -notcontains $expected) { throw "Release asset missing after publish: $expected" }
          }
