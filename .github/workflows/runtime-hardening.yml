name: Runtime hardening

on:
  pull_request:
    paths:
      - "worker/**"
      - "tests/network-hardening-contract.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/runtime-hardening.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Wrangler
        run: npm install
      - name: Run hardening regressions
        run: |
          node worker/runtime-hardening-selftest.mjs
          node tests/network-hardening-contract.mjs
      - name: Validate production Worker configuration
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
