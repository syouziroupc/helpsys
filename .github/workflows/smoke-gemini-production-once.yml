name: Smoke production Gemini once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-gemini-production-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for production and smoke Gemini plus GLM
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://helpsys.syouziroupc.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const body={
            request:'設定を開く次の操作を案内して',
            history:[],
            systemContext:{foregroundProcess:'explorer',foregroundTitle:'デスクトップ',foregroundProcessId:1234,taskbarVisible:true,runningApps:['explorer'],browser:null},
            evidence:{screenshotPresent:false},
            elements:[{id:'u1',name:'スタート',automationId:'Start',className:'',controlType:'Button',processName:'explorer',interactable:true,enabled:true,keyboardFocusable:true,focused:false,password:false,processId:1234,value:null,toggleState:null,selected:null,expandCollapseState:null,x:0,y:0,width:80,height:40}]
          };
          let last='';
          for(let i=0;i<30;i++){
            try{
              const h=await fetch(base+'/health/outlaw',{cache:'no-store'});
              const hj=await h.json();
              if(h.ok && hj?.geminiConfigured===true){
                body.aiProvider='gemini';
                const g=await fetch(base+'/v1/outlaw-plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
                const gt=await g.text();
                last=`gemini HTTP ${g.status}: ${gt.slice(0,500)}`;
                console.log(last);
                if(g.ok){
                  const gj=JSON.parse(gt);
                  if(!['target','clarify','done','not_found'].includes(gj?.status)) throw new Error('invalid Gemini status');
                  body.aiProvider='glm';
                  const r=await fetch(base+'/v1/outlaw-plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
                  const rt=await r.text();
                  console.log(`glm HTTP ${r.status}: ${rt.slice(0,500)}`);
                  if(!r.ok) throw new Error('GLM failed after Gemini fix');
                  process.exit(0);
                }
              } else {
                last='health not ready: '+JSON.stringify(hj);
                console.log(last);
              }
            }catch(e){ last=String(e?.stack||e); console.log(last); }
            await sleep(6000);
          }
          throw new Error('production Gemini did not become healthy: '+last);
          NODE
