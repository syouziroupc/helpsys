name: HelpSys Stable smoke

on:
  pull_request:
    paths:
      - "src/HelpSys.Stable/**"
      - "worker/stable-gemini.js"
      - "wrangler.stable.jsonc"
      - "tests/stable-*.mjs"
      - ".github/workflows/stable-smoke.yml"
  workflow_dispatch:

jobs:
  stable-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check clean stable worker and contracts
        shell: pwsh
        run: |
          node --check worker/stable-gemini.js
          node --check tests/stable-worker-selftest.mjs
          node --check tests/stable-rebuild-contract.mjs

      - name: Run stable worker and architecture contracts
        shell: pwsh
        run: |
          node tests/stable-worker-selftest.mjs
          node tests/stable-rebuild-contract.mjs

      - name: Restore clean stable project
        run: dotnet restore src/HelpSys.Stable/HelpSys.Stable.csproj

      - name: Build clean stable project
        run: dotnet build src/HelpSys.Stable/HelpSys.Stable.csproj -c Release --no-restore

      - name: Publish self-contained stable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/HelpSys.Stable/HelpSys.Stable.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o publish\stable-win-x64

      - name: Launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'publish\stable-win-x64\HelpSys.Stable.exe'
          if (-not (Test-Path $exe)) { throw 'HelpSys.Stable.exe was not published.' }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "HelpSys.Stable exited during startup smoke with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Package smoke artifact
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish\stable-win-x64\*' -DestinationPath 'HelpSys-Stable-win-x64.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: HelpSys-Stable-win-x64
          path: HelpSys-Stable-win-x64.zip
          if-no-files-found: error
