name: HelpSys Stable smoke

on:
  pull_request:
    paths:
      - "src/HelpSys.Stable/**"
      - "HelpSys.sln"
      - "worker/stable-gemini.js"
      - "worker/education-gemini.js"
      - "worker/stable-router.js"
      - "wrangler.jsonc"
      - "wrangler.stable.jsonc"
      - "wrangler.education.jsonc"
      - "tests/stable-*.mjs"
      - "tests/stable_*.ps1"
      - "tests/mock_stable_server.py"
      - "tests/HelpSys.Stable.Tests/**"
      - ".github/workflows/stable-smoke.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  stable-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Gemini worker syntax
        shell: pwsh
        run: |
          node --check worker/stable-gemini.js
          node --check worker/education-gemini.js
          node --check worker/stable-router.js
          node --check tests/stable-worker-selftest.mjs
          node --check tests/stable-education-selftest.mjs
          node --check tests/stable-rebuild-contract.mjs
          node --check tests/stable-adversarial-selftest.mjs
          python -m py_compile tests/mock_stable_server.py

      - name: Run Stable contracts
        shell: pwsh
        run: |
          node tests/stable-worker-selftest.mjs
          node tests/stable-education-selftest.mjs
          node tests/stable-rebuild-contract.mjs
          node tests/stable-adversarial-selftest.mjs

      - name: Restore Stable project and tests
        shell: pwsh
        run: |
          dotnet restore src/HelpSys.Stable/HelpSys.Stable.csproj
          dotnet restore tests/HelpSys.Stable.Tests/HelpSys.Stable.Tests.csproj

      - name: Build Stable project and tests
        shell: pwsh
        run: |
          dotnet build src/HelpSys.Stable/HelpSys.Stable.csproj -c Release --no-restore
          dotnet build tests/HelpSys.Stable.Tests/HelpSys.Stable.Tests.csproj -c Release --no-restore

      - name: Run Stable C# safety and validation tests
        run: dotnet run --project tests/HelpSys.Stable.Tests/HelpSys.Stable.Tests.csproj -c Release --no-build

      - name: Publish and startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/HelpSys.Stable/HelpSys.Stable.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -o publish\stable-win-x64

          $exe = Join-Path $PWD 'publish\stable-win-x64\HelpSys.Stable.exe'
          if (-not (Test-Path $exe)) { throw 'HelpSys.Stable.exe was not published.' }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "HelpSys Stable exited during startup smoke with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Run Stable GUI F8 and privacy smoke
        shell: pwsh
        run: ./tests/stable_gui_smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HelpSys-Stable-3.0.0-win-x64
          path: |
            publish/stable-win-x64/
            artifacts/
          if-no-files-found: error
