name: Validate tiered safety and updater patch

on:
  push:
    branches:
      - fix/tiered-safety-auto-update-20260914
    paths:
      - tools/apply_tiered_safety_fix.py
      - .github/workflows/tiered-safety-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiered-safety-fix
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiered-safety-auto-update-20260914
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact-match patch
        shell: pwsh
        run: python tools/apply_tiered_safety_fix.py

      - name: Verify no patch helper remains staged for product release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'src/HelpSys.Desktop/Services/UpdateService.cs')) { throw 'UpdateService.cs was not created.' }
          if (-not (Test-Path 'src/HelpSys.Desktop/MainWindow.Update.cs')) { throw 'MainWindow.Update.cs was not created.' }

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Run JS contract suite
        run: npm test

      - name: Build Windows desktop
        run: dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore

      - name: Build CI test variant
        run: dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -p:TestBuild=true

      - name: Commit validated patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/release.yml package.json
          if (git diff --cached --quiet) { throw 'Patch produced no product changes.' }
          git commit -m 'Fix tiered privacy recovery and add secure updater'
          git push origin HEAD:fix/tiered-safety-auto-update-20260914
