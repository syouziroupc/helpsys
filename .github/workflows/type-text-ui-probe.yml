name: Type text UI probe

on:
  pull_request:
    paths:
      - "src/HelpSys.Desktop/**"
      - "tests/type_text_mock_server.py"
      - "tests/type_text_ui_probe.ps1"
      - "tests/HelpSys.VirtualTarget/**"
      - ".github/workflows/type-text-ui-probe.yml"
  workflow_dispatch:

jobs:
  type-text-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore
        run: dotnet restore HelpSys.sln
      - name: Build
        run: dotnet build HelpSys.sln -c Release --no-restore
      - name: Verify wrong text is rejected and correct text advances
        shell: pwsh
        run: tests/type_text_ui_probe.ps1
      - name: Upload type-text diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-text-ui-probe
          path: artifacts/type-text-*
          if-no-files-found: warn
