name: Virtual exhaustive diagnostics

on:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse every JavaScript test and Worker module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem worker,tests -Recurse -File | Where-Object { $_.Extension -in '.js','.mjs' } | Sort-Object FullName | ForEach-Object { node --check $_.FullName }
      - name: Run every Worker selftest and test contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem worker -File -Filter '*selftest.mjs' | Sort-Object Name | ForEach-Object { Write-Host "RUN $($_.Name)"; node $_.FullName }
          Get-ChildItem tests -File -Filter '*.mjs' | Sort-Object Name | ForEach-Object { Write-Host "RUN $($_.Name)"; node $_.FullName }
      - name: Compile every Python helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem worker,tests -Recurse -File -Filter '*.py' | ForEach-Object { python -m py_compile $_.FullName }
      - name: Parse every PowerShell helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem tests -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; Write-Host "PS_PARSE_FAILURE $($_.FullName)"; $errors | ForEach-Object { Write-Host $_.Message } }
          }
          if ($failed) { throw 'PowerShell parse failures found.' }

  build-matrix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HelpSys.sln
      - name: Build Release
        run: dotnet build HelpSys.sln -c Release --no-restore
      - name: Build Debug
        run: dotnet build HelpSys.sln -c Debug --no-restore
      - name: Publish self-contained win-x64
        run: dotnet publish src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
      - name: Verify published executable
        shell: pwsh
        run: if (-not (Test-Path 'artifacts/publish/HelpSys.exe')) { throw 'Published HelpSys.exe is missing.' }

  repeated-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet restore HelpSys.sln
      - run: dotnet build HelpSys.sln -c Release --no-restore
      - name: Repeat real UI guidance five times
        shell: pwsh
        run: tests/repeated_ui_probe.ps1
      - name: Upload repeated UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-repeated-ui
          path: artifacts/*.json
          if-no-files-found: warn

  network-failure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HelpSys.sln
      - run: dotnet build HelpSys.sln -c Release --no-restore
      - name: Planner outage must not crash desktop
        shell: pwsh
        run: tests/network_failure_probe.ps1

  advanced-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet restore HelpSys.sln
      - run: dotnet build HelpSys.sln -c Release --no-restore
      - name: Verify live privacy redaction and off-route recovery
        shell: pwsh
        run: tests/advanced_ui_probe.ps1
      - name: Upload advanced UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-advanced-ui
          path: |
            artifacts/mock-last-request.json
            artifacts/mock-last-image.png
          if-no-files-found: warn
