name: Windows smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Worker syntax
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/visible-first.js
          node --check worker/start-state-guard.js
          node --check worker/deliberation-guard.js
          node --check worker/deliberation-selftest.mjs
          node --check worker/reliability-v4-guard.js
          node --check worker/reliability-v4-selftest.mjs
          node --check worker/quality-guide.js
          node --check worker/quality-guide-selftest.mjs
          node --check worker/transcribe.js
          node --check worker/transcribe-selftest.mjs
          node --check tests/site-release-contract.mjs
          node --check tests/commander-stability-contract.mjs

      - name: Test Worker contract
        run: |
          node worker/selftest.mjs
          node worker/policy-selftest.mjs
          node worker/visible-first-selftest.mjs
          node worker/deliberation-selftest.mjs
          node worker/reliability-v4-selftest.mjs
          node worker/quality-guide-selftest.mjs
          node worker/transcribe-selftest.mjs

      - name: Test site and release contract
        run: node tests/site-release-contract.mjs

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Build
        run: dotnet build HelpSys.sln -c Release --no-restore

      - name: Launch and capture desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $mock = Start-Process python -ArgumentList 'tests/mock_guide_server.py' -PassThru -WindowStyle Hidden
          $env:HELPSYS_API_BASE = 'http://127.0.0.1:8765'
          Start-Sleep -Seconds 1

          $target = Start-Process powershell.exe -ArgumentList '-NoProfile','-STA','-ExecutionPolicy','Bypass','-File','tests/smoke_target.ps1' -PassThru
          Start-Sleep -Seconds 3

          $exe = Resolve-Path 'src/HelpSys.Desktop/bin/Release/net10.0-windows/HelpSys.exe'
          $overlayProcess = $null
          $process = $null

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient

          function Save-DesktopScreenshot([string] $path) {
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $PWD $path), [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }

          function Find-HelpSysElement([string] $automationId) {
            if ($null -eq $process -or $process.HasExited) { return $null }
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              $process.Id)
            $idCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty,
              $automationId)
            $condition = New-Object System.Windows.Automation.AndCondition($processCondition, $idCondition)
            return $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Get-HelpSysNames {
            if ($null -eq $process -or $process.HasExited) { return @() }
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              $process.Id)
            $nodes = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $processCondition)
            $names = @()
            foreach ($node in $nodes) {
              try {
                $name = $node.Current.Name
                if (-not [string]::IsNullOrWhiteSpace($name)) { $names += $name }
              }
              catch { }
            }
            return $names
          }

          try {
            # Visual regression check for the actual listening overlay. No microphone is used.
            $env:HELPSYS_SMOKE_LISTENING_OVERLAY = '1'
            $overlayProcess = Start-Process $exe -PassThru
            Start-Sleep -Seconds 2
            if ($overlayProcess.HasExited) { throw 'HelpSys exited before the listening overlay screenshot.' }
            Save-DesktopScreenshot 'artifacts/helpsys-listening-overlay.png'
            Stop-Process -Id $overlayProcess.Id -Force
            $overlayProcess.WaitForExit()
            $overlayProcess = $null
            Remove-Item Env:HELPSYS_SMOKE_LISTENING_OVERLAY -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw 'HelpSys exited before the idle smoke screenshot.' }
            Save-DesktopScreenshot 'artifacts/helpsys-idle.png'

            $requestBox = Find-HelpSysElement 'RequestBox'
            $guideButton = Find-HelpSysElement 'GuideButton'
            $commanderButton = Find-HelpSysElement 'CommanderButton'
            if ($null -eq $requestBox -or $null -eq $guideButton -or $null -eq $commanderButton) {
              throw 'HelpSys core or Commander UI Automation controls were not exposed.'
            }

            $valuePattern = $requestBox.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $valuePattern.SetValue('open the test target')

            $invokePattern = $guideButton.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokePattern.Invoke()
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw 'HelpSys exited while producing quality-first guidance.' }

            if (-not (Test-Path 'artifacts/mock-last-request.json')) {
              Save-DesktopScreenshot 'artifacts/helpsys-quality-request-failure.png'
              throw 'Quality-first planner did not reach the mock API.'
            }
            $diagnostics = Get-Content 'artifacts/mock-last-request.json' -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($diagnostics.path -ne '/v1/quality-guide') {
              throw "Normal HelpSys used the wrong planning route: $($diagnostics.path)"
            }
            if ($diagnostics.hasScreenshot -ne $true) {
              throw 'Normal HelpSys planning request did not include the current screenshot.'
            }
            if ($diagnostics.eligible.automationId -notcontains 'SmokeButton') {
              Write-Host '--- mock quality-first diagnostics ---'
              Get-Content 'artifacts/mock-last-request.json' -Encoding UTF8
              throw 'Quality-first scan did not use the dedicated smoke work surface.'
            }

            $names = @(Get-HelpSysNames)
            $instruction = '青い枠の場所で、マウスの左ボタンを1回押してください。'
            if (-not ($names | Where-Object { $_ -like '手順*' -or $_ -eq $instruction })) {
              Save-DesktopScreenshot 'artifacts/helpsys-guidance-failure.png'
              Write-Host '--- mock quality-first diagnostics ---'
              Get-Content 'artifacts/mock-last-request.json' -Encoding UTF8
              throw "HelpSys did not expose an actionable quality-first guidance step. UIA names: $($names -join ' | ')"
            }

            Save-DesktopScreenshot 'artifacts/helpsys-guidance.png'
          }
          finally {
            Remove-Item Env:HELPSYS_SMOKE_LISTENING_OVERLAY -ErrorAction SilentlyContinue
            if ($null -ne $overlayProcess -and -not $overlayProcess.HasExited) { Stop-Process -Id $overlayProcess.Id -Force }
            if ($null -ne $process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
            if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force }
          }

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpsys-windows-smoke
          path: |
            artifacts/*.png
            artifacts/*.json
          if-no-files-found: warn
