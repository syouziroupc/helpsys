name: Windows smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Worker and contract syntax
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/visible-first.js
          node --check worker/start-state-guard.js
          node --check worker/deliberation-guard.js
          node --check worker/reliability-v4-guard.js
          node --check worker/quality-guide.js
          node --check worker/transcribe.js
          node --check tests/site-release-contract.mjs
          node --check tests/privacy-contract.mjs
          node --check tests/privacy-capability-contract.mjs
          node --check tests/privacy-resume-contract.mjs
          node --check tests/safe-edition-contract.mjs
          node --check tests/worker-data-handling-contract.mjs

      - name: Test Worker and privacy contracts
        run: |
          node worker/selftest.mjs
          node worker/policy-selftest.mjs
          node worker/visible-first-selftest.mjs
          node worker/deliberation-selftest.mjs
          node worker/reliability-v4-selftest.mjs
          node worker/quality-guide-selftest.mjs
          node worker/transcribe-selftest.mjs
          node tests/privacy-contract.mjs
          node tests/privacy-capability-contract.mjs
          node tests/privacy-resume-contract.mjs
          node tests/safe-edition-contract.mjs
          node tests/worker-data-handling-contract.mjs
          node tests/site-release-contract.mjs

      - name: Restore
        run: dotnet restore HelpSys.sln

      - name: Build unified edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'smoke-bin/normal' | Out-Null
          dotnet build HelpSys.sln -c Release --no-restore
          dotnet build src/HelpSys.Desktop/HelpSys.Desktop.csproj -c Release --no-restore -o smoke-bin/normal
          if (-not (Test-Path 'smoke-bin/normal/HelpSys.exe')) { throw 'Unified HelpSys smoke executable was not produced.' }
          if (Test-Path 'smoke-bin/normal/HelpSys.Safe.exe') { throw 'Separate Safe executable must not be produced by the unified build.' }

      - name: Launch unified desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Resolve-Path 'smoke-bin/normal/HelpSys.exe'
          $process = Start-Process $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw 'Unified HelpSys exited during startup.' }
            Add-Type -AssemblyName UIAutomationClient
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
            $nodes = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $processCondition)
            $ids = @()
            foreach ($node in $nodes) { try { if ($node.Current.AutomationId) { $ids += $node.Current.AutomationId } } catch { } }
            foreach ($required in @('RequestBox','GuideButton','PrivacyButton','VoiceButton','CommanderButton')) {
              if ($ids -notcontains $required) { throw "Unified HelpSys UI missing: $required" }
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Password and OTP privacy GUI smoke
        shell: pwsh
        run: ./tests/privacy_gui_smoke.ps1

      - name: Privacy Mode automatic resume GUI smoke
        shell: pwsh
        run: ./tests/privacy_resume_smoke.ps1

      - name: Process-bound occluder redaction smoke
        shell: pwsh
        run: ./tests/occluder_redaction_smoke.ps1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpsys-unified-windows-smoke
          path: artifacts/*
          if-no-files-found: warn
